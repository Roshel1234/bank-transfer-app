
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <header class="page-header">
        <h1>Transaction History</h1>
        <p>View account transaction details.</p>
    </header>

    <!-- Customer Information -->
    <section class="section" th:if="${customer != null}">

        <h2>Customer Details</h2>

        <div class="customer-details">
            <p>
                <strong>Name:</strong>
                <span th:text="${customer.fullName}"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${customer.email}"></span>
            </p>

            <p>
                <strong>Account Number:</strong>
                <span th:text="${customer.accountNumber}"></span>
            </p>

            <p>
                <strong>Current Balance:</strong>
                <span th:text="${customer.balance}"></span>
            </p>
        </div>

    </section>

    <section class="section" th:if="${customer == null}">
        <p class="error-message">Customer account not found.</p>
    </section>

    <!-- Transaction History Table -->
    <section class="section">

        <h2>All Transactions</h2>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>From Account</th>
                    <th>To Account</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th>Date</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="transaction : ${transactions}">

                    <td th:text="${transaction.id}"></td>
                    <td th:text="${transaction.fromAccount}"></td>
                    <td th:text="${transaction.toAccount}"></td>
                    <td th:text="${transaction.amount}"></td>

                    <td>
                        <span th:text="${transaction.status}"
                              th:class="${transaction.status.name() == 'SUCCESS'} ? 'status-success' : 'status-failed'">
                        </span>
                    </td>

                    <td th:text="${transaction.description}"></td>
                    <td th:text="${transaction.createdAt}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="7">No transaction history available.</td>
                </tr>

                </tbody>
            </table>
        </div>

        <a th:href="@{/}" class="secondary-button back-button">
            Back to Dashboard
        </a>

    </section>

</div>

</body>
</html>
